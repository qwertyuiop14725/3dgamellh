<!doctype html>
<html lang="zh-CN" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080d">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305080d'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23ffd08a'/%3E%3C/svg%3E">
<title>环境检测 · 雪迹 Cold Smoke</title>
<style>
:root{
  color-scheme: dark;
  --ink:#05080d; --snow:#f4f7fb; --dim:rgba(244,247,251,.68); --faint:rgba(244,247,251,.47);
  --hair:rgba(244,247,251,.22); --sun:#ffd08a; --mint:#b6e3ce; --salmon:#ff9d8a;
  --f-song:"Noto Serif SC","Songti SC","STSong","Source Han Serif SC","Noto Serif CJK SC","SimSun",serif;
  --f-ui:"Jost","Futura","Avenir Next","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:#05080d}
body{
  min-height:100vh; min-height:100dvh;
  background:
    radial-gradient(125% 80% at 50% 112%, rgba(255,186,110,.15), rgba(255,186,110,0) 62%),
    radial-gradient(95% 62% at 50% -14%, rgba(96,136,190,.21), rgba(96,136,190,0) 66%),
    var(--ink);
  color:var(--snow);
  font-family:var(--f-ui);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:radial-gradient(120% 90% at 50% 42%, rgba(0,0,0,0) 42%, rgba(0,0,0,.42) 100%);
}
body::after{
  content:""; position:fixed; left:0; right:0; bottom:0; height:36vh; z-index:0; pointer-events:none;
  background:radial-gradient(78% 118% at 50% 108%, rgba(255,196,130,.13), rgba(255,196,130,0) 72%);
  clip-path:polygon(0 52%,14% 44%,27% 57%,41% 39%,55% 55%,69% 43%,83% 53%,100% 45%,100% 100%,0 100%);
  opacity:.55;
}
#snow{position:fixed; inset:0; z-index:1; overflow:hidden; pointer-events:none}
.flake{position:absolute; top:-5vh; border-radius:50%; background:#fff; filter:blur(.3px);
  animation-name:fall; animation-timing-function:linear; animation-iteration-count:infinite; will-change:transform}
@keyframes fall{from{transform:translate3d(0,-6vh,0)}to{transform:translate3d(var(--dx,0px),106vh,0)}}

main{
  position:relative; z-index:2; width:100%; max-width:820px; margin:0 auto;
  min-height:100vh; min-height:100dvh;
  padding:calc(clamp(26px,5.5vh,64px) + env(safe-area-inset-top)) clamp(18px,4vw,40px) calc(28px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; justify-content:center;
}

/* ---------- mark ---------- */
.mark{display:flex; align-items:center; justify-content:center; gap:13px; opacity:.92}
.mark .cn{font-family:var(--f-song); font-size:20px; letter-spacing:.3em; text-indent:.3em; line-height:1}
.mark .rule{width:36px; height:1px; background:linear-gradient(90deg,rgba(244,247,251,0),rgba(244,247,251,.36),rgba(244,247,251,0))}
.mark .en{font-size:9px; letter-spacing:.42em; color:var(--dim); line-height:1}

/* ---------- head ---------- */
.head{text-align:center; margin-top:clamp(24px,4.5vh,42px)}
.kicker{font-size:9.5px; letter-spacing:.44em; text-indent:.44em; color:var(--faint); text-transform:uppercase}
h1{
  margin:13px 0 0; font-family:var(--f-song); font-weight:500;
  font-size:clamp(30px,5.4vw,46px); letter-spacing:.18em; text-indent:.18em; line-height:1.2;
}
.lede{
  margin:13px auto 0; max-width:34em; font-size:12px; line-height:1.9; letter-spacing:.11em;
  color:var(--dim);
}
.lede span{display:block}

/* ---------- meter ---------- */
.meter{position:relative; max-width:620px; width:100%; margin:clamp(24px,4vh,34px) auto 0; height:1px; background:rgba(244,247,251,.14)}
.meter i{position:absolute; left:0; top:0; height:1px; width:0; background:linear-gradient(90deg,rgba(244,247,251,.92),var(--sun));
  box-shadow:0 0 12px rgba(255,208,138,.55); transition:width .55s cubic-bezier(.3,0,.2,1)}
.meter .count{position:absolute; right:0; top:9px; font-size:9px; letter-spacing:.24em; color:var(--faint); font-variant-numeric:tabular-nums}

/* ---------- list ---------- */
.list{list-style:none; margin:24px auto 0; padding:0; width:100%; max-width:620px}
.row{
  position:relative; display:grid; grid-template-columns:28px minmax(0,1fr) auto; gap:11px; align-items:start;
  padding:12px 2px 13px; border-bottom:1px solid rgba(244,247,251,.085);
  opacity:0; transform:translateY(6px); transition:opacity .5s ease, transform .5s cubic-bezier(.2,.6,.2,1);
}
.row.in{opacity:1; transform:none}
.row .idx{font-size:9px; letter-spacing:.08em; color:rgba(244,247,251,.3); padding-top:4px; font-variant-numeric:tabular-nums}
.row .line{display:flex; align-items:baseline; flex-wrap:wrap; gap:0 9px; min-height:17px}
.row .cn{font-family:var(--f-song); font-size:14.5px; letter-spacing:.12em; color:var(--snow); line-height:1.45}
.row .en{font-size:8px; letter-spacing:.26em; color:rgba(244,247,251,.26); text-transform:uppercase; white-space:nowrap}
.row .detail{display:block; margin-top:4px; font-size:11px; line-height:1.65; letter-spacing:.045em; color:var(--faint); transition:color .3s ease}
.row.pass .detail{color:rgba(244,247,251,.58)}
.row.warn .detail{color:rgba(255,208,138,.8)}
.row.fail .detail{color:rgba(255,157,138,.92)}
.row.run .detail{color:rgba(244,247,251,.62)}
.row.run::after{
  content:""; position:absolute; left:0; right:0; bottom:-1px; height:1px;
  background:linear-gradient(90deg,rgba(255,208,138,0),rgba(255,208,138,.9),rgba(255,208,138,0));
  background-size:38% 100%; background-repeat:no-repeat; animation:sweep 1.15s linear infinite;
}
@keyframes sweep{from{background-position:-40% 0}to{background-position:140% 0}}
.st{display:flex; align-items:center; justify-content:flex-end; gap:6px; min-width:56px; padding-top:2px;
  font-size:10px; letter-spacing:.14em; color:var(--faint); white-space:nowrap}
.st svg{width:13px; height:13px; display:block; flex:none}
.row.pass .st{color:var(--mint)}
.row.warn .st{color:var(--sun)}
.row.fail .st{color:var(--salmon)}
.row.run .st{color:var(--snow)}
.spin{animation:spin 1s linear infinite; transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- result ---------- */
.result{
  max-width:620px; width:100%; margin:26px auto 0; padding-top:24px; text-align:center;
  border-top:1px solid rgba(244,247,251,.13); animation:rise .65s cubic-bezier(.2,.6,.2,1) both;
}
@keyframes rise{from{opacity:0; transform:translateY(9px)}to{opacity:1; transform:none}}
.r-icon{width:46px; height:46px; margin:0 auto 16px; border:1px solid currentColor; border-radius:50%;
  display:flex; align-items:center; justify-content:center; opacity:.95}
.r-icon svg{width:20px; height:20px; display:block}
.result.pass .r-icon{color:var(--mint); border-color:rgba(182,227,206,.34)}
.result.fail .r-icon{color:var(--salmon); border-color:rgba(255,157,138,.34)}
.result.exit .r-icon{color:rgba(244,247,251,.42); border-color:rgba(244,247,251,.18)}
.r-title{margin:0; font-family:var(--f-song); font-weight:500; font-size:clamp(23px,3.7vw,31px);
  letter-spacing:.2em; text-indent:.2em; line-height:1.35}
.result.pass .r-title{color:var(--snow)}
.result.fail .r-title{color:#ffbcb0}
.result.exit .r-title{color:var(--dim)}
.r-sub{margin:11px auto 0; max-width:34em; font-size:11.5px; line-height:1.9; letter-spacing:.075em; color:var(--dim); text-wrap:pretty}
.actions{display:flex; flex-wrap:wrap; justify-content:center; gap:11px; margin-top:21px}
.btn{
  appearance:none; -webkit-appearance:none; border:0; cursor:pointer; border-radius:999px;
  min-width:132px; height:45px; padding:0 25px;
  font-family:var(--f-song); font-size:15px; letter-spacing:.3em; text-indent:.3em;
  transition:filter .25s ease, transform .25s ease, border-color .25s ease, color .25s ease;
}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(180deg,#f7d6a2,#eeb25c); color:#1b1408;
  box-shadow:0 6px 22px rgba(255,186,96,.18),0 1px 0 rgba(255,255,255,.5) inset}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{background:transparent; border:1px solid rgba(244,247,251,.24); color:var(--dim)}
.btn-ghost:hover{border-color:rgba(255,208,138,.66); color:var(--snow)}
.btn:focus{outline:2px solid rgba(255,208,138,.6); outline-offset:3px}
.btn:focus:not(:focus-visible){outline:none}
.btn:focus-visible{outline:2px solid var(--sun); outline-offset:3px}
.enter{margin-top:20px; display:flex; flex-direction:column; align-items:center; gap:9px}
.enter-bar{width:148px; height:1px; background:rgba(244,247,251,.15); overflow:hidden}
.enter-bar i{display:block; width:0; height:1px; background:linear-gradient(90deg,var(--snow),var(--sun))}
.enter .hint{font-size:9.5px; letter-spacing:.24em; color:var(--faint)}
.enter .enter-link{
  padding:3px 6px; cursor:pointer; color:var(--dim); font-size:10.5px; letter-spacing:.14em;
  text-decoration:underline; text-decoration-color:rgba(244,247,251,.24); text-underline-offset:4px;
}
.enter .enter-link:hover{color:var(--sun)}
.enter .enter-link:focus-visible{outline:1px solid var(--sun); outline-offset:3px}

/* ---------- report ---------- */
.report{max-width:620px; width:100%; margin:24px auto 0; border-top:1px solid rgba(244,247,251,.09)}
.report summary{
  list-style:none; cursor:pointer; padding:12px 2px; display:flex; align-items:center; gap:9px;
  font-size:9.5px; letter-spacing:.28em; color:var(--faint); user-select:none;
}
.report summary::-webkit-details-marker{display:none}
.report summary::before{
  content:""; width:4px; height:4px; margin-right:2px; flex:none;
  border-right:1px solid currentColor; border-bottom:1px solid currentColor;
  transform:rotate(-45deg); transition:transform .2s ease;
}
.report[open] summary::before{transform:rotate(45deg)}
.report summary .sum-en{margin-left:auto; font-size:8px; letter-spacing:.3em; color:rgba(244,247,251,.24)}
.report-body{padding-bottom:4px}
.report pre{
  margin:0; padding:14px 15px; max-height:280px; overflow:auto;
  font:10.5px/1.75 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  color:rgba(244,247,251,.5); background:rgba(244,247,251,.028);
  border:1px solid rgba(244,247,251,.07); border-radius:2px;
  white-space:pre-wrap; word-break:break-word; user-select:text; -webkit-user-select:text;
}
.copy{
  appearance:none; -webkit-appearance:none; margin-top:9px; padding:5px 10px; cursor:pointer;
  background:none; border:1px solid rgba(244,247,251,.14); border-radius:2px;
  font:inherit; font-size:9.5px; letter-spacing:.16em; color:var(--faint);
  transition:border-color .2s ease,color .2s ease;
}
.copy:hover{border-color:rgba(255,208,138,.5); color:var(--sun)}
.copy:focus-visible{outline:1px solid var(--sun); outline-offset:2px}

/* ---------- footer ---------- */
footer{margin-top:clamp(26px,5vh,44px); text-align:center; font-size:9px; line-height:2; letter-spacing:.2em; color:rgba(244,247,251,.25)}
footer .sep{margin:0 .55em; color:rgba(244,247,251,.18)}
.noscript{max-width:620px; margin:28px auto 0; padding:14px 16px; border:1px solid rgba(255,157,138,.35);
  color:#ffbcb0; font-size:12px; line-height:1.8; letter-spacing:.05em; text-align:center}
.noscript a{color:var(--sun)}
.no-js .meter,.no-js .list{display:none}
.sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0}

@media (max-width:560px){
  .row{grid-template-columns:20px minmax(0,1fr) auto; gap:8px; padding:11px 1px 12px}
  .row .en{display:none}
  .st{min-width:49px; font-size:9.5px; letter-spacing:.06em; gap:5px}
  .st svg{width:12px; height:12px}
  .btn{min-width:118px; height:44px; padding:0 19px; font-size:14px}
  .r-icon{width:42px; height:42px; margin-bottom:14px}
  .mark .rule{width:26px}
  .lede{font-size:11.5px}
}
@media (max-height:620px){
  main{justify-content:flex-start}
  .head{margin-top:20px}
}
@media (prefers-reduced-motion: reduce){
  #snow{display:none}
  .row{transition:none; opacity:1; transform:none}
  .result{animation:none}
  .row.run::after,.spin{animation:none}
  .enter-bar i{transition:none!important}
}
</style>
</head>
<body>
<div id="snow" aria-hidden="true"></div>

<main>
  <header class="mark">
    <span class="cn">雪迹</span><i class="rule"></i><span class="en">COLD SMOKE</span>
  </header>

  <div class="head">
    <div class="kicker">Strict Check · 严格检测</div>
    <h1>环境检测</h1>
    <p class="lede"><span>在雪落下来之前，先确认这台设备能把它画出来。</span><span>检测只在本机进行，不会上传任何信息。</span></p>
  </div>

  <noscript>
    <div class="noscript">需要启用 JavaScript 才能检测环境并运行游戏。<br><a href="游戏.html">仍然打开游戏</a></div>
  </noscript>

  <div class="meter" aria-hidden="true">
    <i id="meter-fill"></i>
    <span class="count" id="meter-count">00 / 10</span>
  </div>

  <ol class="list" id="list"></ol>

  <section class="result" id="result" hidden>
    <div class="r-icon" id="r-icon" aria-hidden="true"></div>
    <h2 class="r-title" id="r-title"></h2>
    <p class="r-sub" id="r-sub"></p>
    <div class="actions" id="r-actions"></div>
    <div class="enter" id="enter" hidden>
      <div class="enter-bar"><i id="enter-fill"></i></div>
      <span class="hint">正在进入《雪迹》…</span>
      <a class="enter-link" id="enter-now" href="游戏.html">立即进入</a>
    </div>
  </section>

  <details class="report" id="report" hidden>
    <summary>检测详情<span class="sum-en">Details</span></summary>
    <div class="report-body">
      <pre id="report-pre"></pre>
      <button type="button" class="copy" id="copy">复制详情</button>
    </div>
  </details>

  <footer>
    雪迹 · 一个人，一座山，一直往下<br>
    检测器 v1.2<span class="sep">/</span>WebView 95 基线<span class="sep">/</span>桌面兼容<span class="sep">/</span>不上传数据
  </footer>
</main>

<p class="sr-only" id="sr-status" aria-live="polite" role="status"></p>

<script>
(function () {
  'use strict';
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/, 'js');

  /* 如果游戏文件名不同，只改这一行 */
  var GAME_FILE = '游戏.html';

  /* ---- 严格基线：内核不得低于 Android System WebView 95 / Chromium 95 ----
     WebView 95（2021-10）与 Chrome 95、Edge 95、WebView2 95 同代；
     Firefox 94、Safari / iOS WebKit 15 为同期等价内核。 */
  var MIN_WEBVIEW = 95;      // Blink / Chromium / WebView 硬基线
  var MIN_GECKO   = 94;      // Firefox 同期等价
  var MIN_WEBKIT  = 15;      // Safari / iOS WebKit 同期等价
  var RECOMMEND   = 110;     // 建议版本（Chromium 系）
  var RECOMMEND_WEBKIT = 16; // 建议版本（WebKit 系）

  var LABEL = { wait: '等待', run: '检测中', pass: '通过', warn: '注意', fail: '未通过' };
  var ICON = {
    wait: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.1" fill="currentColor"/></svg>',
    run: '<svg class="spin" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.6" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".22"/><path d="M8 2.4a5.6 5.6 0 0 1 5.6 5.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
    pass: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.7 8.5l3.5 3.4 7.1-8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    warn: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5l5.6 10.1H2.4z" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/><path d="M8 6.2v3.3M8 11.3v.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>',
    fail: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.3 3.3l9.4 9.4M12.7 3.3l-9.4 9.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
    exit: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 8h8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>'
  };

  var ROWS = [
    { id: 'page',    cn: '页面环境', en: 'PAGE',        hint: '平台 · 安全上下文 · 现代接口' },
    { id: 'entry',   cn: '游戏入口', en: 'GAME FILE',    hint: '入口文件 · 可读性 · 内容校验' },
    { id: 'kernel',  cn: '浏览器内核', en: 'ENGINE',      hint: '内核识别 · WebView 95 基线' },
    { id: 'gpu',     cn: '图形接口', en: 'GRAPHICS',    hint: 'WebGPU / WebGL2' },
    { id: 'render',  cn: '渲染自检', en: 'RENDER',      hint: '着色器 · 离屏绘制 · HDR' },
    { id: 'audio',   cn: '声音',     en: 'AUDIO',       hint: 'Web Audio · 离线渲染' },
    { id: 'input',   cn: '操作',     en: 'INPUT',       hint: '指针事件 · 触摸 · 键盘' },
    { id: 'perf',    cn: '性能',     en: 'PERFORMANCE', hint: 'GPU 压力测试' },
    { id: 'storage', cn: '存档',     en: 'STORAGE',     hint: '本地设置' },
    { id: 'display', cn: '显示',     en: 'DISPLAY',     hint: '画面 · 像素比 · 方向' }
  ];

  var state = { done: 0, results: [], finished: false, mode: 'scan', leaving: false, timer: null };
  var env = { ua: null, kernel: null, webgl: null, render: null, gpu: null, gpuPromise: null, perf: null, chList: null };
  var rowEls = {};

  function $(id) { return document.getElementById(id); }
  function now() { return (window.performance && performance.now) ? performance.now() : new Date().getTime(); }
  function pad(n) { return n < 10 ? '0' + n : String(n); }
  function msgOf(e) { return (e && e.message) ? e.message : String(e); }
  function metaOf(id) {
    for (var i = 0; i < ROWS.length; i++) { if (ROWS[i].id === id) return ROWS[i]; }
    return { id: id, cn: id, en: '', hint: '' };
  }

  /* ---------------- rows / meter ---------------- */

  function buildRows() {
    var list = $('list');
    if (!list) return;
    for (var i = 0; i < ROWS.length; i++) {
      (function (meta, index) {
        var li = document.createElement('li');
        li.className = 'row';
        li.id = 'row-' + meta.id;
        li.innerHTML = '<span class="idx">' + pad(index + 1) + '</span>' +
          '<span class="body"><span class="line"><b class="cn"></b><i class="en"></i></span><span class="detail"></span></span>' +
          '<span class="st"><span class="ico"></span><span class="lb">等待</span></span>';
        li.getElementsByTagName('b')[0].textContent = meta.cn;
        li.getElementsByTagName('i')[0].textContent = meta.en;
        li.getElementsByClassName('detail')[0].textContent = meta.hint;
        list.appendChild(li);
        rowEls[meta.id] = li;
        setTimeout(function () { li.classList.add('in'); }, 60 + index * 55);
      })(ROWS[i], i);
    }
  }

  function setRow(id, level, detail) {
    var li = rowEls[id];
    if (!li) return;
    li.classList.remove('pass', 'warn', 'fail', 'run');
    if (level) li.classList.add(level);
    var label = li.getElementsByClassName('lb')[0];
    var ico = li.getElementsByClassName('ico')[0];
    var det = li.getElementsByClassName('detail')[0];
    if (label) label.textContent = LABEL[level] || level || '';
    if (ico) ico.innerHTML = ICON[level] || ICON.wait;
    if (det && detail) det.textContent = detail;
  }

  function progress() {
    var fill = $('meter-fill'), count = $('meter-count');
    if (fill) fill.style.width = (state.done / ROWS.length * 100).toFixed(2) + '%';
    if (count) count.textContent = pad(state.done) + ' / ' + pad(ROWS.length);
  }

  function announce(text) {
    var el = $('sr-status');
    if (el) el.textContent = text;
  }

  /* ---------------- user agent ---------------- */

  function uaInfo() {
    var ua = navigator.userAgent || '';
    var engine = '未知浏览器', ver = '', container = '', m = null;

    if (/MicroMessenger/i.test(ua)) container = '微信';

      if (fired) return;
      fired = true;
      done({ level: 'warn', detail: '压力测试超时，性能未知' });
    }, 1200);
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        if (fired) return;
        fired = true;
        clearTimeout(timer);
        try { env.perf = perfGL(); } catch (e) { env.perf = { ok: false, ms: 0, reason: msgOf(e) }; }
        done(checkPerf());
      });
    });
  }

  function checkStorage() {
    try {
      localStorage.setItem('__cs_gate__', '1');
      var v = localStorage.getItem('__cs_gate__');
      localStorage.removeItem('__cs_gate__');
      sessionStorage.setItem('__cs_gate__', '1');
      sessionStorage.removeItem('__cs_gate__');
      if (v !== '1') throw new Error('readback');
      return { level: 'pass', detail: '本地存储可用 · 设置会保留' };
    } catch (e) {
      return { level: 'warn', detail: '本地存储被禁用 · 设置无法保存（不影响游玩）' };
    }
  }

  function checkDisplay() {
    var w = Math.round(window.innerWidth), h = Math.round(window.innerHeight);
    var dpr = Math.round((window.devicePixelRatio || 1) * 100) / 100;
    var small = Math.min(w, h) < 300;
    var desktop = isDesktop();
    var bits = [w + ' × ' + h, 'DPR ' + dpr, desktop ? '桌面窗口' : (h >= w ? '竖屏' : '横屏')];
    bits.push(desktop ? '桌面布局' : (h >= w ? '自动旋转适配' : '横屏运行'));
    if (small) bits.push('视口偏小');
    return {
      level: small ? 'warn' : 'pass',
      detail: bits.join(' · ')
    };
  }

  /* ---------------- runner ---------------- */

  var STEPS = [
    { id: 'page', run: function (done) { done(checkPage()); } },
    { id: 'entry', run: checkGameFile },
    { id: 'kernel', run: function (done) { done(checkKernel()); } },
    { id: 'gpu', run: checkGPU },
    { id: 'render', run: function (done) { done(checkRender()); } },
    { id: 'audio', run: function (done) { done(checkAudio()); } },
    { id: 'input', run: function (done) { done(checkInput()); } },
    { id: 'perf', run: measurePerf },
    { id: 'storage', run: function (done) { done(checkStorage()); } },
    { id: 'display', run: function (done) { done(checkDisplay()); } }
  ];

  var stepIndex = 0;

  function record(id, res) {
    var meta = metaOf(id);
    res = res || {};
    var level = res.level || 'pass';
    if (level !== 'pass' && level !== 'warn' && level !== 'fail') level = 'pass';
    var detail = res.detail || '正常';

    setRow(id, level, detail);
    state.results.push({ id: id, cn: meta.cn, level: level, detail: detail });
    state.done = state.results.length;
    progress();
    announce(meta.cn + '：' + (LABEL[level] || level) + '，' + detail);
  }

  function nextStep() {
    if (stepIndex >= STEPS.length) { finish(); return; }
    var step = STEPS[stepIndex++];
    var meta = metaOf(step.id);
    setRow(step.id, 'run', meta.hint);

    var t0 = now();
    var settled = false;

    function complete(res) {
      if (settled) return;
      settled = true;
      var dt = now() - t0;
      var hold = Math.max(0, 155 - dt);
      setTimeout(function () {
        record(step.id, res);
        setTimeout(nextStep, 95);
      }, hold);
    }

    try {
      step.run(complete);
    } catch (e) {
      complete({ level: 'fail', detail: '检测异常：' + msgOf(e) });
    }
  }

  function finish() {
    if (state.finished) return;
    state.finished = true;

    var fails = [], warns = [];
    for (var i = 0; i < state.results.length; i++) {
      if (state.results[i].level === 'fail') fails.push(state.results[i]);
      else if (state.results[i].level === 'warn') warns.push(state.results[i]);
    }

    renderReport(fails, warns);
    var report = $('report');
    if (report) report.hidden = false;

    releaseGL();

    if (fails.length) showFail(fails);
    else showPass(warns);
  }

  function releaseGL() {
    try {
      if (env.webgl && env.webgl.gl) {
        var lose = env.webgl.gl.getExtension('WEBGL_lose_context');
        if (lose) lose.loseContext();
      }
    } catch (e) {}
  }

  /* ---------------- states ---------------- */

  function ensureVisible(el) {
    if (!el) return;
    setTimeout(function () {
      try {
        var rect = el.getBoundingClientRect();
        var over = rect.bottom - window.innerHeight;
        if (over > -8) {
          var top = (window.pageYOffset || document.documentElement.scrollTop || 0) + over + 26;
          try { window.scrollTo({ top: top, behavior: 'smooth' }); }
          catch (e) { window.scrollTo(0, top); }
        }
      } catch (e) {}
    }, 80);
  }

  function showPass(warns) {
    state.mode = 'pass';
    var box = $('result');
    box.hidden = false;
    box.className = 'result pass';
    $('r-icon').innerHTML = ICON.pass;
    $('r-title').textContent = '可以出发';
    $('r-sub').textContent = warns.length
      ? '环境可用，有 ' + warns.length + ' 项提示（不影响进入）。正在打开《雪迹》…'
      : '环境就绪，正在打开《雪迹》…';
    $('r-actions').hidden = true;
    $('r-actions').innerHTML = '';

    var enter = $('enter');
    enter.hidden = false;
    var fill = $('enter-fill');
    var delay = warns.length ? 3600 : 1700;

    fill.style.transition = 'none';
    fill.style.width = '0%';
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        fill.style.transition = 'width ' + delay + 'ms linear';
        fill.style.width = '100%';
      });
    });

    try { $('enter-now').href = gameURL(); } catch (eHref) {}
    $('enter-now').onclick = function (e) { e.preventDefault(); goGame(); };
    state.timer = setTimeout(goGame, delay);
    announce('检测通过。' + (warns.length ? '有 ' + warns.length + ' 项提示。' : '') + '正在进入游戏。');
    ensureVisible(box);
  }

  function showFail(fails) {
    state.mode = 'fail';
    var box = $('result');
    box.hidden = false;
    box.className = 'result fail';
    $('r-icon').innerHTML = ICON.fail;

    var names = [], others = [], kernelFail = false;
    for (var i = 0; i < fails.length; i++) {
      names.push(fails[i].cn);
      if (fails[i].id === 'kernel') kernelFail = true;
      else others.push(fails[i].cn);
    }
    $('r-title').textContent = kernelFail ? '浏览器内核不兼容' : '检测未通过';
    $('r-sub').textContent = kernelFail
      ? '当前内核低于 WebView ' + MIN_WEBVIEW + ' / Chromium ' + MIN_WEBVIEW + ' 基线，游戏可能无法启动或直接黑屏' +
        (others.length ? '；同时' + others.join('、') + '未通过' : '') +
        '。请升级系统 WebView 或改用最新版 Chrome、Edge、Safari——你也可以坚持游玩。'
      : '缺少运行游戏所需的关键能力：' + names.join('、') + '。画面可能黑屏、卡顿或无法操作——你可以退出，也可以坚持游玩。';

    var actions = $('r-actions');
    actions.hidden = false;
    actions.innerHTML =
      '<button type="button" class="btn btn-primary" id="b-go">坚持游玩</button>' +
      '<button type="button" class="btn btn-ghost" id="b-exit">退出</button>';
    $('b-go').onclick = goGame;
    $('b-exit').onclick = exitGate;
    $('enter').hidden = true;

    var report = $('report');
    if (report) report.open = true;

    announce('检测未通过：' + names.join('、') + '。可以选择退出，或坚持进入。');
    ensureVisible(box);
    try { $('b-go').focus({ preventScroll: true }); } catch (e) { try { $('b-go').focus(); } catch (e2) {} }
  }

  function exitGate() {
    if (state.mode === 'exit') return;
    state.mode = 'exit';
    if (state.timer) { clearTimeout(state.timer); state.timer = null; }
    try { window.close(); } catch (e) {}

    setTimeout(function () {
      if (state.mode !== 'exit') return;
      var box = $('result');
      box.hidden = false;
      box.className = 'result exit';
      $('r-icon').innerHTML = ICON.exit;
      $('r-title').textContent = '已退出检测';
      $('r-sub').textContent = '这个标签页可以关闭了。如果没有自动关闭，请手动关闭它。';

      var actions = $('r-actions');
      actions.hidden = false;
      actions.innerHTML =
        '<button type="button" class="btn btn-ghost" id="b-again">重新检测</button>' +
        '<button type="button" class="btn btn-ghost" id="b-still">仍然进入</button>';
      $('b-again').onclick = function () { window.location.reload(); };
      $('b-still').onclick = goGame;
      $('enter').hidden = true;

      announce('已退出检测。这个标签页可以关闭了。');
      ensureVisible(box);
    }, 260);
  }

  function gameURL() {
    var url = GAME_FILE;
    try {
      var u = new URL(GAME_FILE, window.location.href);
      if (env.webgl && env.webgl.ok && (!env.gpu || !env.gpu.ok)) u.searchParams.set('backend', 'webgl2');
      url = u.href;
    } catch (e) {}
    return url;
  }

  function goGame() {
    if (state.leaving) return;
    state.leaving = true;
    if (state.timer) { clearTimeout(state.timer); state.timer = null; }
    var url = gameURL();
    try { window.location.replace(url); }
    catch (e2) { window.location.href = url; }
  }

  /* ---------------- report ---------------- */

  function fmtTime(d) {
    function p(n) { return n < 10 ? '0' + n : String(n); }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' +
      p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  function renderReport(fails, warns) {
    var lines = [];
    var info = env.ua || uaInfo();
    var verdict = fails.length
      ? '未通过（' + fails.length + ' 项关键缺失）'
      : (warns.length ? '通过（' + warns.length + ' 项提示）' : '通过');

    lines.push('雪迹 · 运行环境检测');
    lines.push('结果：' + verdict);
    lines.push('兼容性：' + (fails.length ? '不兼容' : (warns.length ? '基本兼容（' + warns.length + ' 项提示）' : '完全兼容')));
    lines.push('判定标准：WebView / Chromium ≥ ' + MIN_WEBVIEW + '（建议 ' + RECOMMEND + '+）· Firefox ≥ ' + MIN_GECKO +
      ' · Safari / WebKit ≥ ' + MIN_WEBKIT + '（建议 ' + RECOMMEND_WEBKIT + '+）· WebGL2 必需');
    lines.push('设备形态：' + (isDesktop() ? '桌面端（鼠标 / 键盘）' : '移动 / 手持（触屏 / 旋转）'));
    lines.push('时间：' + fmtTime(new Date()));
    lines.push('浏览器：' + info.engine + (info.ver ? ' ' + info.ver : '') +
      (info.container ? ' · ' + info.container + '内置' : '') + ' · ' + platformLabel());
    if (env.kernel) {
      var k = env.kernel;
      lines.push('内核：' + k.engineName + (k.version ? ' ' + fmtVer(k.version) : '') +
        (k.brand && k.brand !== k.engineName ? ' · ' + k.brand + (k.brandVersion ? ' ' + k.brandVersion : '') : '') +
        (k.mismatch ? ' · UA 与指纹不一致' : ' · 指纹一致'));
      lines.push('运行容器：' + (k.webview || (k.container ? k.container + '内置' : '系统浏览器')) +
        (k.webview && k.container ? ' · ' + k.container + '内置' : '') + (k.desktop ? ' · 桌面' : ''));
      lines.push('版本来源：' + (k.chVersion
        ? 'UA-CH 实核 ' + k.chVersion + '（UA 声称 ' + (k.uaMajor || '—') + '）'
        : 'UA 声称 ' + (k.uaMajor || '—') + ' / 内核指纹'));
      if (k.baseline) {
        var cssMiss = k.baseline.missingCss.length ? '（缺 ' + k.baseline.missingCss.join('、') + '）' : '';
        var apiMiss = k.baseline.missingApi.length ? '（缺 ' + k.baseline.missingApi.join('、') + '）' : '';
        var enhMiss = k.baseline.missingEnhanced.length ? '（缺 ' + k.baseline.missingEnhanced.join('、') + '，不阻断）' : '';
        lines.push('语法基线：ES2020 ' + (k.baseline.es2020 ? '通过' : '失败') +
          ' · async/await ' + (k.baseline.asyncOk ? '通过' : '失败'));
        lines.push('启动接口：' + k.baseline.apiOk + '/' + k.baseline.apiTotal + apiMiss);
        lines.push('阻断级 CSS：' + k.baseline.cssOk + '/' + k.baseline.cssTotal + cssMiss);
        lines.push('增强级 CSS：' + k.baseline.enhancedOk + '/' + k.baseline.enhancedTotal + enhMiss);
      }
      if (k.chBrands && k.chBrands.length) {
        var cbs = [];
        for (var ci = 0; ci < k.chBrands.length; ci++) {
          var cb = k.chBrands[ci] || {};
          if (cb.brand && !/Not.*Brand/i.test(cb.brand)) cbs.push(cb.brand + ' ' + cb.version);
        }
        if (cbs.length) lines.push('UA-CH：' + cbs.join(' / '));
      }
    }
    lines.push('打开方式：' + (window.location.protocol === 'file:' ? '本地文件' : window.location.protocol.replace(':', '').toUpperCase()));
    lines.push('屏幕：' + Math.round(window.innerWidth) + ' × ' + Math.round(window.innerHeight) +
      ' @ DPR ' + (Math.round((window.devicePixelRatio || 1) * 100) / 100));

    if (env.gpu && env.gpu.ok) {
      lines.push('图形：WebGPU · ' + env.gpu.name);
    } else if (env.webgl && env.webgl.ok) {
      lines.push('图形：WebGL2 · ' + (env.webgl.renderer || '未知'));
    } else {
      lines.push('图形：不可用');
    }
    if (env.gpu && !env.gpu.ok && env.gpu.reason) lines.push('WebGPU：' + env.gpu.reason);
    if (env.webgl && env.webgl.ok) {
      lines.push('WebGL2：' + (env.webgl.ver || '—') + ' · MAX_TEXTURE_SIZE ' + (env.webgl.maxTex || '—') +
        ' · HDR ' + (env.webgl.hdr ? '可用' : '不可用'));
      lines.push('显卡：' + (env.webgl.vendor || '未知') + ' / ' + (env.webgl.renderer || '未知'));
    }
    if (env.render) {
      lines.push('绘制自检：' + (env.render.pixel ? '通过' : '失败') +
        ' · HDR 目标 ' + (env.render.hdrTarget ? '可用' : '不可用') +
        (env.render.error ? ' · ' + env.render.error : ''));
    }
    if (env.perf && env.perf.ok) lines.push('性能：' + env.perf.ms.toFixed(1) + ' ms/帧（480×270 压力测试）');
    lines.push('硬件：' + (navigator.hardwareConcurrency || '—') + ' 核 · ' +
      (navigator.deviceMemory ? navigator.deviceMemory + ' GB' : '内存未知'));

    lines.push('');
    for (var i = 0; i < state.results.length; i++) {
      var r = state.results[i];
      lines.push('[' + (LABEL[r.level] || r.level) + '] ' + r.cn + '：' + r.detail);
    }
    lines.push('');
    lines.push('UA：' + navigator.userAgent);

    var pre = $('report-pre');
    if (pre) pre.textContent = lines.join('\n');
  }

  function fallbackCopy(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      ta.style.top = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  }

  function bindCopy() {
    var btn = $('copy');
    if (!btn) return;
    btn.onclick = function () {
      var pre = $('report-pre');
      var text = pre ? pre.textContent : '';
      var old = btn.textContent;

      function done(ok) {
        btn.textContent = ok ? '已复制' : '复制失败';
        setTimeout(function () { btn.textContent = old; }, 1600);
      }

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(fallbackCopy(text)); });
      } else {
        done(fallbackCopy(text));
      }
    };
  }

  /* ---------------- snow / boot ---------------- */

  function makeSnow() {
    var host = $('snow');
    if (!host) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var n = window.innerWidth < 620 ? 22 : 34;
    var frag = document.createDocumentFragment();
    for (var i = 0; i < n; i++) {
      var f = document.createElement('i');
      f.className = 'flake';
      var size = (Math.random() * 2.2 + 0.8).toFixed(2);
      var dur = Math.random() * 18 + 14;
      f.style.left = (Math.random() * 100).toFixed(2) + '%';
      f.style.width = size + 'px';
      f.style.height = size + 'px';
      f.style.opacity = (Math.random() * 0.42 + 0.14).toFixed(2);
      f.style.setProperty('--dx', (Math.random() * 140 - 70).toFixed(0) + 'px');
      f.style.animationDuration = dur.toFixed(1) + 's';
      f.style.animationDelay = (-Math.random() * dur).toFixed(1) + 's';
      frag.appendChild(f);
    }
    host.appendChild(frag);
  }

  function boot() {
    makeSnow();
    buildRows();
    bindCopy();
    progress();

    env.ua = uaInfo();

    function start() {
      try { env.kernel = kernelInfo(); } catch (eKernel) { env.kernel = null; }

      // 让第一帧先画出来，再开始占用 GPU
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          try {
            env.webgl = probeWebGL2();
            if (env.webgl.ok) env.render = testGL(env.webgl.gl);
            if (navigator.gpu) env.gpuPromise = probeWebGPU();
          } catch (e) {
            // 探测失败不阻塞流程，交由各项检查报告
          }
          setTimeout(nextStep, 140);
        });
      });
    }

    /* 先取 UA-CH 高精度内核版本（最多等 700ms），再识别内核版本 */
    var uad = navigator.userAgentData;
    if (uad && uad.getHighEntropyValues) {
      var settled = false;
      var wait = setTimeout(function () {
        if (settled) return;
        settled = true;
        start();
      }, 700);
      try {
        uad.getHighEntropyValues(['fullVersionList']).then(function (hi) {
          if (settled) return;
          settled = true;
          clearTimeout(wait);
          env.chList = (hi && hi.fullVersionList) || [];
          start();
        }, function () {
          if (settled) return;
          settled = true;
          clearTimeout(wait);
          start();
        });
      } catch (eUA) {
        if (!settled) { settled = true; clearTimeout(wait); start(); }
      }
    } else {
      start();
    }
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && state.mode === 'fail') { e.preventDefault(); exitGate(); return; }
    var tag = (e.target && e.target.tagName) ? e.target.tagName.toUpperCase() : '';
    if (tag === 'BUTTON' || tag === 'A' || tag === 'SUMMARY' || tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (e.key === 'Enter') {
      if (state.mode === 'pass' || state.mode === 'fail') { e.preventDefault(); goGame(); }
      else if (state.mode === 'exit') { e.preventDefault(); window.location.reload(); }
    }
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
